# Сборка Focusly для Windows, macOS и Linux и публикация в GitHub Releases.
# Запускается, когда в main меняется package.json (например, поднята версия) или этот файл,
# либо вручную: Actions → Release → Run workflow.
# Порядок: prepare (черновик релиза) → build (3 системы параллельно, каждая загружает свои файлы) → publish.
# Если релиз этой версии уже опубликован — всё пропускается.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version and create draft release
        id: ver
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          STATE=$(gh release view "v$V" --json isDraft -q '.isDraft' 2>/dev/null || echo "none")
          if [ "$STATE" = "false" ]; then
            echo "v$V is already published — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "none" ]; then
            gh release create "v$V" --draft --title "Focusly $V" --generate-notes --target "$GITHUB_SHA"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload to release
        shell: bash
        run: |
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.dmg dist/*.AppImage dist/*.blockmap dist/latest*.yml)
          ls -la "${FILES[@]}"
          gh release upload "v${{ needs.prepare.outputs.version }}" "${FILES[@]}" --clobber

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish release
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --draft=false --latest
