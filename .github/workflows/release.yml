# Сборка Windows-установщика и публикация в GitHub Releases.
# Запускается, когда в main меняется package.json (например, поднята версия) или этот файл,
# либо вручную: Actions → Release → Run workflow.
# Если в релизе этой версии уже есть установщик — сборка пропускается.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check if this version is already released
        id: ver
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "Focusly-Setup-$VERSION.exe"; then
            echo "v$VERSION is already released — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building v$VERSION"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        if: steps.ver.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.ver.outputs.skip == 'false'
        run: npm ci

      - name: Build installer
        if: steps.ver.outputs.skip == 'false'
        run: npx electron-builder --win nsis --publish never

      - name: Publish release
        if: steps.ver.outputs.skip == 'false'
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v$V"
          FILES="dist/Focusly-Setup-$V.exe dist/Focusly-Setup-$V.exe.blockmap dist/latest.yml"
          ls -la $FILES
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --draft=false --latest
          else
            gh release create "$TAG" $FILES --title "Focusly $V" --generate-notes --latest
          fi
